[project]
name = "colliand-notes"
version = "0.1.0"
description = "notes.colliand.com: notebooks built with MyST"
requires-python = "==3.13.*"
dependencies = [
    "ipykernel",
    "jupyter-server",
    "pandas==2.3.3",
    "geopandas==1.1.4",
    "matplotlib",
    "pyyaml==6.0.3",
    "rasterio==1.5.1",
]

[tool.uv]
package = false
exclude-newer = "2026-10-09T00:00:00Z"

# Cloudflare Pages runs `pip install .` on its own before the build command; there is nothing to package.
[tool.setuptools]
py-modules = []
