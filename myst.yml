version: 1
project:
  title: Notes
  authors:
    - name: Jim Colliander
      url: https://colliand.com
  github: https://github.com/colliand/colliand-notes
  license: CC-BY-4.0
  # The power button on notes with code: runs them in the page on mybinder.org (environment in binder/)
  jupyter:
    binder:
      repo: colliand/colliand-notes
      ref: main
  exclude:
    - README.md
    - templates/**
    - binder/**
    - maps-src/**
  toc:
  # BEGIN toc (scripts/build_index.py)
    - file: index.md
    - title: Floods
      children:
        - file: floods/nooksack-flood-2021.md
    - title: Glaciers
      children:
        - file: glaciers/mount-baker.md
        - file: glaciers/baker-bright-ice.md
        - file: glaciers/mount-hood.md
    - title: Fires
      children:
        - file: fires/perry-severity.md
  # END toc
site:
  template: book-theme
  title: Notes · Jim Colliander
  options:
    logo_text: notes.colliand.com
    style: custom.css
  nav:
    - title: colliand.com
      url: https://colliand.com
